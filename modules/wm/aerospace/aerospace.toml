# AeroSpace Configuration
config-version = 2
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# ログイン時に起動します．
start-at-login = true

# デフォルトのレイアウトをタイル型 (tiles) にします．
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ポップアップ・ミニツールバー（PowerPoint等）やメニューバーの誤消滅・フォーカス強奪を防ぐため，
# マウス追従 (focus-follows-mouse) およびカーソルワープ (move-mouse) は無効化します．
focus-follows-mouse.enabled = false

# AeroSpace起動完了時にJankyBorders（アクティブウィンドウ枠線表示ツール）をバックグラウンド実行します．
# 色はmatugenパレット(~/.cache/matugen/colors.lua)のaccent/mutedに追従します
# (未生成時はWSL/NixOS側と同じ青ベースのフォールバック値を使います)．
# 参考: modules/theming/matugen/mac/matugen-apply.sh, modules/wm/aerospace/launch-borders.sh
after-startup-command = [
  'exec-and-forget /Users/nalt/.local/bin/aerospace-launch-borders'
]

# フォーカス変更時に枠線色を更新する (フローティング中は補色に切り替わる)．
on-focus-changed = ['exec-and-forget /Users/nalt/.local/bin/aerospace-launch-borders']

# 特定の固定サイズアプリ・ダイアログ・ポップアップのフローティング例外ルール
# 新規GUIアプリ追加時は，以下の基準に該当する場合ここへ登録する（詳細は docs/aerospace.md）:
#   1. 独自ポップアップ・ミニツールバーを別ウィンドウ生成するアプリ (Microsoft Office等)
#   2. 固定サイズのユーティリティ・認証・設定画面 (システム設定, Bitwarden, KensingtonWorks, Spokenly等)
#   3. 動画の小窓 (Picture-in-Picture) やランチャー系ポップアップ
on-window-detected = [
  { if = 'test %{window-title} ~= "wallpaper picker"', run = 'layout floating' },
  { if = 'test %{window-title} ~= "(?i)picture.in.picture"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.apple.systempreferences"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.apple.finder"', run = 'layout floating' },
  # Microsoft Office（図形右クリック等のミニツールバー・サブウィンドウ保護）
  { if = 'test %{app-bundle-id} = "com.microsoft.Powerpoint"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.microsoft.Excel"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.microsoft.Word"', run = 'layout floating' },
  # 固定サイズ・常駐ポップアップ系ユーティリティ
  { if = 'test %{app-bundle-id} = "com.bitwarden.desktop"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.kensington.kensingtonworks2.app"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "app.spokenly"', run = 'layout floating' }
]

# ワークスペースとモニタの割り当て（メイン: 1〜5 / サブモニタ: 6〜9）
# Komorebi（Windows側）と構成を統一しています．
# サブモニタ未接続時は自動的にメインモニタへフォールバックします．
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']

# ギャップ設定（Gaps）
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 8
outer.bottom = 8
outer.top = 4
outer.right = 8

# キーバインド設定（Main Mode）
# macOS標準および一般コピペ（Cmd）と衝突させないため，すべての操作プレフィックスに Ctrl+Cmd (ctrl-cmd) を使用します．
[mode.main.binding]
# ウィンドウ間のフォーカス移動（Option + HJKL）
ctrl-cmd-h = 'focus left'
ctrl-cmd-j = 'focus down'
ctrl-cmd-k = 'focus up'
ctrl-cmd-l = 'focus right'

# ウィンドウの移動（Option + Shift + HJKL）
ctrl-cmd-shift-h = 'move left'
ctrl-cmd-shift-j = 'move down'
ctrl-cmd-shift-k = 'move up'
ctrl-cmd-shift-l = 'move right'

# ウィンドウサイズの簡易調整（Option + UIPO）
ctrl-cmd-u = 'resize width -50'
ctrl-cmd-p = 'resize width +50'
ctrl-cmd-o = 'resize height +50'
ctrl-cmd-i = 'resize height -50'

# service モードへの移行（Option + R）．リサイズ・フロート切替・均等化・設定リロードなど
# 「たまに使う調整系」の操作はこのモードの中の1キーに集約しています（AeroSpaceデフォルトの service モードと同じ考え方）．
ctrl-cmd-r = 'mode service'

# 分割方向の切り替え（Option + /．AeroSpaceデフォルトの alt-slash と同じ）
ctrl-cmd-slash = 'layout tiles horizontal vertical'

# アコーディオンレイアウトの切り替え（Option + ,．AeroSpaceデフォルトの alt-comma と同じ）
ctrl-cmd-comma = 'layout accordion horizontal vertical'

# ゴーストウィンドウ（空ノード）の解消・ツリー平坦化（Option + E）
ctrl-cmd-e = 'flatten-workspace-tree'

# AeroSpace自体の一時停止/再開はキーに割り当てない．停止中は全バインドが無効になりキーから再開できないため，
# 必要なときはターミナルから `aerospace enable off` / `aerospace enable on` を実行する．

# フルスクリーン表示の切り替え（Option + F）
ctrl-cmd-f = 'fullscreen'

# ウィンドウの最小化（Option + M）
ctrl-cmd-m = 'macos-native-minimize'

# ウィンドウを閉じる（Option + Q が Ctrl+Cmd+Shift+W を送信します）．
ctrl-cmd-shift-w = 'close'

# ワークスペース間のフォーカス移動（Option + S / Option + A が ctrl-cmd-s / ctrl-cmd-a を送信します）．
ctrl-cmd-s = 'workspace next'
ctrl-cmd-a = 'workspace prev'

# 直近のワークスペースと切り替え（Option + D が ctrl-cmd-t を送信します）．
ctrl-cmd-t = 'workspace-back-and-forth'

# 特定ワークスペースへのダイレクトジャンプ（Option + 1-9）
ctrl-cmd-1 = 'workspace 1'
ctrl-cmd-2 = 'workspace 2'
ctrl-cmd-3 = 'workspace 3'
ctrl-cmd-4 = 'workspace 4'
ctrl-cmd-5 = 'workspace 5'
ctrl-cmd-6 = 'workspace 6'
ctrl-cmd-7 = 'workspace 7'
ctrl-cmd-8 = 'workspace 8'
ctrl-cmd-9 = 'workspace 9'

# フォーカスウィンドウを別ワークスペースへ移動し，フォーカスも追従させます（Option + Shift + 1-9）．
ctrl-cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
ctrl-cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# アプリケーションのクイック起動を行います．
ctrl-cmd-enter = 'exec-and-forget open -n -a WezTerm'
ctrl-cmd-y = 'exec-and-forget /etc/profiles/per-user/nalt/bin/wezterm start /etc/profiles/per-user/nalt/bin/yazi'
ctrl-cmd-n = 'exec-and-forget /etc/profiles/per-user/nalt/bin/wezterm start /etc/profiles/per-user/nalt/bin/nvim'
ctrl-cmd-v = 'exec-and-forget open -n -a Vivaldi'
ctrl-cmd-w = 'exec-and-forget /Users/nalt/.local/bin/wallpaper-pick-popup'

# ウィンドウの結合（Option + Ctrl + HJKL）
ctrl-cmd-alt-h = 'join-with left'
ctrl-cmd-alt-j = 'join-with down'
ctrl-cmd-alt-k = 'join-with up'
ctrl-cmd-alt-l = 'join-with right'

# service モード（Option + R で入る）
# h/j/k/l のリサイズだけはモードに留まり連続操作できる．それ以外は実行後に main へ戻る．
[mode.service.binding]
h = 'resize width -50'
l = 'resize width +50'
k = 'resize height +50'
j = 'resize height -50'
# フロート/タイリングの切り替え（枠線色もフロート時は補色に更新）
f = ['layout floating tiling', 'exec-and-forget /Users/nalt/.local/bin/aerospace-launch-borders', 'mode main']
# ウィンドウサイズの均等化
b = ['balance-sizes', 'mode main']
# 設定の再読み込み＋ゴースト枠解消＋開いている全窓へのルール遡及適用
c = ['reload-config', 'flatten-workspace-tree', 'run-callback --for-every-window on-window-detected', 'mode main']
esc = 'mode main'
enter = 'mode main'
