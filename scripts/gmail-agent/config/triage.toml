# AI による重要度判定と、その結果の Gmail への反映 (`gmail-agent run`)。

model = "gemini-3.8-flash-medium"   # `agy models` で確認できる ID
batch_size = 25                     # 1 回の AI 呼び出しに渡すメール数
# 認証コード等はモデルに送らない (件名自体にコードが入るため)
sensitive_pattern = "認証キー|認証コード|確認コード|ワンタイム|verification code|one-time|OTP|パスコード|security code"

rubric = """あなたは大学院生(就活・研究・開発をしている個人)のメール秘書です。
各メールの重要度を次の4段階で判定してください。
- urgent: 期限が近い連絡(24〜48時間以内)、決済・セキュリティの異常、人から個人宛で返事待ちのもの
- action: 対応が要るが急ぎではないもの(GitHub のレビュー依頼・アサイン、大学や就活の提出物・案内、研究室連絡)
- info: 読めばよいだけの通知(決済完了・配送連絡・CI 結果など)
- ignore: プロモーション・メルマガ・SNS 通知・自動配信"""

# 個別ルール (上の基準より優先)。基準を変えたいときはここに足す。
hints = [
  "iCloud / Apple の「ストレージ容量が上限」系の通知は頻繁に届くため、重要度は ignore にする。",
  "クレジットカード会社(楽天カード・PayPayカード・オリコ等)の「不正利用の確認」「緊急のご連絡」は、利用が多いときに実際に届く。urgent にする。",
  "イベント(connpass 等)の参加募集の締切通知は、締切が近くても action 止まりにする。",
  "Discord のメールアドレス確認・認証コード・アカウント変更通知は、本人操作の確認用なので info にする。",
]

# 重要度ラベル名。空文字はラベルを付けない。
[labels]
urgent = "重要度/1_緊急"
action = "重要度/2_要対応"
info = "重要度/3_参考"
ignore = ""

[organize]
archive_levels = ["info", "ignore"]            # 受信トレイから外す重要度
# 既存フィルタが「受信トレイに残す」と決めているラベルは、AI 判定でも外さない
protected_labels = ["01_重要/決済・明細", "02_就活・大学"]

# 旧ラベルの移行 (`gmail-agent migrate-labels`)
[legacy]
rename = { "AI/緊急" = "重要度/1_緊急", "AI/要対応" = "重要度/2_要対応", "AI/参考" = "重要度/3_参考" }
delete = ["AI/無視"]   # メールからラベルを外してから、ラベル自体を削除する (メールは消さない)
