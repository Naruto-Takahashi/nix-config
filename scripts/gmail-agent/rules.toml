# gmail-agent が管理するフィルタの望ましい状態。
# 管理対象は `label` で指すラベルを付与するフィルタのみ（他のフィルタには触れない）。
# 各 [[filter]] は同一ラベルの複数フィルタを作れる。

# --- 03_開発/GitHub -------------------------------------------------------
# GitHub の通知メールは全て notifications@github.com から届くが、通知の理由は
# Cc に入る noreply アドレスで区別できる。
#   重要 (受信トレイに残す = スマホ通知): レビュー依頼 / アサイン / メンション / コメント 等
#   それ以外 (CI 結果・watch 通知・状態変更など): アーカイブ
[github]
label = "03_開発/GitHub"
from = "github.com"
important_cc = [
  "review_requested",
  "assign",
  "mention",
  "team_mention",
  "author",
  "comment",
  "security_alert",
]

# --- triage (AI 重要度判定) への個別ヒント -------------------------------------
# 判定プロンプトに追記される。基準を変えたいときはここを編集する。
[triage]
hints = [
  "iCloud / Apple の「ストレージ容量が上限」系の通知は頻繁に届くため、重要度は ignore にする。",
  "クレジットカード会社(楽天カード・PayPayカード・オリコ等)の「不正利用の確認」「緊急のご連絡」は、利用が多いときに実際に届く。urgent にする。",
  "イベント(connpass 等)の参加募集の締切通知は、締切が近くても action 止まりにする。",
  "Discord のメールアドレス確認・認証コード・アカウント変更通知は、本人操作の確認用なので info にする。",
]

# --- 通知 ----------------------------------------------------------------------
# Discord の投稿でメンション(@自分)を付ける重要度。iPhone はメンションされないとプッシュ通知が来ない設定のため。
[notify]
ping_levels = ["urgent", "action"]
