# 全構成が評価 (eval) できることを検証する。
# importパス切れ・構文エラー・オプションのtypoをpush時点で検出するのが目的。
# build ジョブは全構成を実際にビルドし、evalだけでは検出できない依存関係の
# 壊れ (atuinのような外部パッケージ内部実装への依存等) を検出する。atuinの
# TUIを自前パッチでビルドしていた頃は重かったが、パッチを撤廃しキャッシュが
# 効くようになったため常時実行にしている。
#
# build-linuxのnixosConfigurations.nixosビルド(カーネルモジュール等含む
# フルシステム)は変更が無くても毎回イチから作り直され重い。magic-nix-cache-
# action (2025年2月廃止・実質無効) → flakehub-cache-action と2度キャッシュ
# 導入を試みたが、後者は初回キャッシュアップロードだけでbuild-macが
# 24分→30分と大幅に悪化したため撤廃し、素の状態に戻した。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: nix flake check
        run: nix flake check --no-build
      - name: evaluate all homeConfigurations
        run: |
          nix eval '.#homeConfigurations."wsl".activationPackage.drvPath'
          nix eval '.#homeConfigurations."distrobox".activationPackage.drvPath'
          nix eval '.#homeConfigurations."sandbox".activationPackage.drvPath'
      - name: evaluate nixosConfigurations
        run: nix eval '.#nixosConfigurations.nixos.config.system.build.toplevel.drvPath'
      - name: evaluate darwinConfigurations
        run: nix eval '.#darwinConfigurations."mac".config.system.build.toplevel.drvPath'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: shellcheck (zsh スクリプトは対象外)
        run: |
          git ls-files '*.sh' \
            | while read -r f; do head -1 "$f" | grep -q zsh || echo "$f"; done \
            | xargs nix run nixpkgs#shellcheck -- --severity=warning
      - name: starship fallback / template 同期チェック
        # 2ファイルは palettes.matugen ブロック以外同一に保つ規約
        # (modules/theming/matugen/README.md 参照)。コメント行を除いた本文を比較する。
        run: |
          strip() { awk '/^\[palettes\.matugen\]/{exit} !/^#/' "$1"; }
          if ! diff <(strip modules/shell/starship/starship.toml) \
                    <(strip modules/theming/matugen/templates/starship.toml); then
            echo "::error::starship.toml のフォールバック版とテンプレート版の内容が乖離しています"
            exit 1
          fi
      - name: ドキュメント内リンクの死活チェック
        # 全 *.md の相対リンクが実在ファイルを指しているかを検証する。実装は justfile
        # (check-links) に一本化している。リポジトリ構成の変更でドキュメント側の
        # 参照更新を忘れるのを検出するのが目的。
        run: nix run nixpkgs#just -- check-links
      - name: 対になる実装の整合性チェック (SYNC-PAIR)
        # 同じ役割を別ツールで実装しているファイル (kanata/karabiner/ahk、
        # aerospace/hyprland/komorebi など) が、互いを参照し合っているかを検証する。
        # 書式と運用は CONTRIBUTING.md を参照。
        run: nix run nixpkgs#just -- check-sync
      - name: 対になる実装の更新漏れ (警告のみ)
        # PR で、片方だけ変更して対になる実装を変更していないファイルを警告する。
        # 失敗にはしない (意図的に片方だけ直す場合があるため)。
        if: github.event_name == 'pull_request'
        run: nix run nixpkgs#just -- check-sync-changed "${{ github.event.pull_request.base.sha }}"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: build wsl
        run: nix build '.#homeConfigurations."wsl".activationPackage' --no-link
      - name: build distrobox
        run: nix build '.#homeConfigurations."distrobox".activationPackage' --no-link
      - name: build sandbox
        run: nix build '.#homeConfigurations."sandbox".activationPackage' --no-link
      - name: build nixos
        run: nix build '.#nixosConfigurations.nixos.config.system.build.toplevel' --no-link

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: build mac (nix-darwin + Home Manager)
        run: nix build '.#darwinConfigurations."mac".config.system.build.toplevel' --no-link
